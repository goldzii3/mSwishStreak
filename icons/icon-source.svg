<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="ballg" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffb36b"/>
      <stop offset="0.55" stop-color="#f7801f"/>
      <stop offset="1" stop-color="#c4520c"/>
    </radialGradient>
    <linearGradient id="boardg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e6df"/>
    </linearGradient>
    <clipPath id="ballclip"><circle cx="730" cy="420" r="168"/></clipPath>
  </defs>
  
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0a1030"/>
        <stop offset="0.6" stop-color="#18205a"/>
        <stop offset="1" stop-color="#34286a"/>
      </linearGradient>
      <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
        <stop offset="0" stop-color="#fff3d6" stop-opacity="0.38"/>
        <stop offset="1" stop-color="#fff3d6" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1024" height="1024" fill="url(#sky)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <g fill="#ffffff">
      <circle cx="96" cy="120" r="7" opacity="0.8"/>
